[package]
name = "notify-hub-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only notification content auditor for NotifyHub"

[[bin]]
name = "guard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
